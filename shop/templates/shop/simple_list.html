{% extends 'shop/base.html' %}
{% block content %}
    <h1>{{ title }}</h1>
    <a href="create/" class="btn">Добавить</a>
    <hr>
    <ul>
        {% for item in object_list %}
            <li style="margin-bottom: 10px;">
                <a href="{{ item.pk }}/">{{ item }}</a>
                | <a href="{{ item.pk }}/update/">Ред.</a> 
                | <a href="{{ item.pk }}/delete/">Удал.</a>
            </li>
        {% empty %}
            <li>Записей пока нет.</li>
        {% endfor %}
    </ul>
{% endblock %}
